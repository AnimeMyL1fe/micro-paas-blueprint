name: postgresql
description: PostgreSQL with Adminer and postgres_exporter

infrastructure:
  cpu: 2
  ram_mb: 2048
  disk_gb: 20

network:
  inbound_ports:
    - port: 22
      protocol: tcp

    - port: 5432
      protocol: tcp

    - port: 8080
      protocol: tcp

    - port: 9187
      protocol: tcp

ansible:
  shared_roles:
    - docker-install
  service_roles:
    - postgresql